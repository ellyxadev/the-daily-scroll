
name: Daily Scroll refresh and publish

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # 06:15 in Brussels: 04:15 UTC in summer, 05:15 UTC in winter.
    - cron: '15 4,5 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-scroll-pages
  cancel-in-progress: false

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update from RSS
        run: python scripts/update_feed.py

      - name: Add source images and available Dutch summaries
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/enrich_articles.py

      - name: Commit updated archive
        run: |
          git config user.name 'daily-scroll-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/articles.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily article archive'
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
